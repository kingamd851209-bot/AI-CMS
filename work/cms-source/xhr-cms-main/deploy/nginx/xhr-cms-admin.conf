# Load this file from the http {} context (for example /etc/nginx/conf.d/).
# Replace the domain, dist directory, and backend address before deployment.
server {
    listen 80;
    server_name admin.example.com;

    root /opt/xhr-cms/admin-ui/dist;
    index index.html;

    # Forward the public origin and client address to the backend.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";

    # Vue routes and files outside the dedicated asset paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Missing scripts must return 404, not the SPA HTML shell.
    location ^~ /static/ {
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Preserve the /api/ prefix: do not append a slash to proxy_pass.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:7088;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Only global assets are proxied; other /assets/ files come from dist.
    location ^~ /assets/global/ {
        proxy_pass http://127.0.0.1:7088;
    }
}
